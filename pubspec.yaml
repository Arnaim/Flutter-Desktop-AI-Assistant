  shared_preferences: ^2.3.2
  system_info_plus: ^0.0.6
  battery_plus: ^6.2.2
  camera: ^0.11.0+2
  speech_to_text: ^7.3.0
  speech_to_text_windows: ^1.0.0+beta.8

dev_dependencies:
  flutter_test:
    sdk: flutter

