name: ineffa_assistant_bot
description: "Assistant bot project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  http: ^1.2.0
  window_manager: ^0.3.8
  hotkey_manager: ^0.2.3

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  llama_cpp_dart: ^0.2.2
  google_generative_ai: ^0.4.7
  url_launcher: ^6.3.2
  process_run: ^1.2.4
